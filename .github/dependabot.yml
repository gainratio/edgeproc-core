# Monthly dependency updates: minor + patch grouped into one PR per ecosystem, with a
# 7-day cooldown so a fresh release can settle before we take it.
# Semver-major updates are ignored on purpose: majors are migrated by hand, in their own PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors are migrated by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
